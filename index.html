<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آزمونینو | سامانه فرم‌ساز و آزمون‌ساز</title>
  <style>
    :root {
      --p: #2563eb; --ph: #1d4ed8; --pl: #dbeafe;
      --ok: #059669; --warn: #d97706; --err: #dc2626;
      --bg: #f1f5f9; --card: #fff; --side: #0f172a;
      --t: #0f172a; --t2: #475569; --mu: #94a3b8; --bd: #e2e8f0;
      --r: 12px; --sh: 0 4px 16px rgba(15,23,42,.08);
      --f: Tahoma, Arial, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--f); background: var(--bg); color: var(--t); line-height: 1.65; min-height: 100vh; }
    button, input, select, textarea { font-family: inherit; font-size: 14px; }
    .hidden { display: none !important; }
    #auth {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #0f172a, #1e3a5f 50%, #0f172a); padding: 20px;
    }
    .auth-box {
      background: #fff; border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 400px;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
    }
    .auth-logo { text-align: center; margin-bottom: 24px; }
    .auth-logo .m {
      width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
      display: grid; place-items: center; font-size: 24px; font-weight: 800;
    }
    .auth-logo h1 { font-size: 22px; font-weight: 800; }
    .auth-logo p { color: var(--t2); font-size: 13px; margin-top: 4px; }
    .fg { margin-bottom: 14px; }
    .fg label { display: block; font-size: 13px; font-weight: 500; color: var(--t2); margin-bottom: 5px; }
    .fg input, .fg select, .fg textarea {
      width: 100%; padding: 11px 13px; border: 1px solid var(--bd); border-radius: 10px; outline: none;
    }
    .fg input:focus, .fg select:focus, .fg textarea:focus {
      border-color: var(--p); box-shadow: 0 0 0 3px var(--pl);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 18px; border-radius: 10px; font-weight: 600; border: none; cursor: pointer;
      transition: .15s;
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-p { background: var(--p); color: #fff; width: 100%; }
    .btn-p:hover:not(:disabled) { background: var(--ph); }
    .btn-s { background: #fff; color: var(--t); border: 1px solid var(--bd); }
    .btn-s:hover { background: var(--bg); }
    .btn-d { background: var(--err); color: #fff; }
    .btn-sm { padding: 7px 12px; font-size: 13px; width: auto; }
    .auth-err {
      background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px;
      font-size: 13px; margin-bottom: 14px; display: none;
    }
    .auth-err.on { display: block; }
    .auth-sw { text-align: center; margin-top: 16px; font-size: 13px; color: var(--t2); }
    .auth-sw a { color: var(--p); font-weight: 600; cursor: pointer; }
    #app { display: none; min-height: 100vh; }
    #app.on { display: flex; }
    .side {
      width: 250px; background: var(--side); color: #e2e8f0;
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
      display: flex; flex-direction: column; transition: transform .2s;
    }
    .side-h { padding: 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e293b; }
    .side-h .m {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
      display: grid; place-items: center; font-weight: 800;
    }
    .side-h h2 { font-size: 17px; font-weight: 700; }
    .side-nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
    .ni {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; border-radius: 10px; border: none; background: none;
      color: #94a3b8; font-size: 14px; font-weight: 500; cursor: pointer; text-align: right;
      margin-bottom: 2px;
    }
    .ni:hover { background: #1e293b; color: #f1f5f9; }
    .ni.on { background: var(--p); color: #fff; }
    .side-f { padding: 14px; border-top: 1px solid #1e293b; }
    .uchip { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; }
    .av {
      width: 34px; height: 34px; border-radius: 50%; background: var(--p);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex-shrink: 0;
    }
    .uchip .nm { font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .uchip .em { font-size: 11px; color: #64748b; }
    .main { flex: 1; margin-right: 250px; min-height: 100vh; display: flex; flex-direction: column; }
    .top {
      background: #fff; border-bottom: 1px solid var(--bd); padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 30;
    }
    .top-r { display: flex; align-items: center; gap: 8px; position: relative; }
    .iconb {
      width: 38px; height: 38px; border-radius: 10px; border: none; background: transparent;
      cursor: pointer; font-size: 17px; position: relative; color: var(--t2);
    }
    .iconb:hover { background: var(--bg); }
    .badge {
      position: absolute; top: 3px; left: 3px; background: var(--err); color: #fff;
      font-size: 10px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 99px;
      display: grid; place-items: center; padding: 0 3px;
    }
    .content { padding: 22px; flex: 1; }
    .pt { font-size: 21px; font-weight: 800; margin-bottom: 4px; }
    .pd { color: var(--t2); font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; gap: 14px; }
    .g4 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .g3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .stat {
      background: #fff; border: 1px solid var(--bd); border-radius: var(--r);
      padding: 18px; box-shadow: var(--sh);
    }
    .stat .l { font-size: 12px; color: var(--t2); }
    .stat .v { font-size: 26px; font-weight: 800; margin-top: 2px; }
    .card {
      background: #fff; border: 1px solid var(--bd); border-radius: var(--r);
      padding: 18px; box-shadow: var(--sh);
    }
    .ct { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .empty { text-align: center; padding: 40px 16px; color: var(--mu); }
    .empty .b { font-size: 36px; margin-bottom: 8px; }
    .pcard {
      background: #fff; border: 1px solid var(--bd); border-radius: var(--r);
      padding: 16px; cursor: pointer; transition: .15s;
    }
    .pcard:hover { border-color: var(--p); box-shadow: var(--sh); }
    .pcard .ty {
      font-size: 11px; font-weight: 600; color: var(--p); background: var(--pl);
      display: inline-block; padding: 2px 8px; border-radius: 6px; margin-bottom: 6px;
    }
    .pcard h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
    .pcard .meta { font-size: 12px; color: var(--mu); display: flex; gap: 10px; flex-wrap: wrap; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 3px; }
    .dot-d { background: var(--mu); }
    .dot-p { background: var(--ok); }
    .dot-c { background: var(--warn); }
    .bld { display: grid; grid-template-columns: 200px 1fr 260px; gap: 12px; min-height: 55vh; }
    .bp { background: #fff; border: 1px solid var(--bd); border-radius: var(--r); padding: 14px; }
    .flib button {
      width: 100%; text-align: right; padding: 9px 10px; border: 1px solid var(--bd);
      background: #fff; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-size: 13px;
    }
    .flib button:hover { border-color: var(--p); background: var(--pl); }
    .fi {
      background: #fff; border: 1px solid var(--bd); border-radius: 10px; padding: 12px 14px;
      margin-bottom: 8px; position: relative; cursor: pointer;
    }
    .fi:hover { border-color: #93c5fd; }
    .fi.sel { border-color: var(--p); box-shadow: 0 0 0 2px var(--pl); }
    .fi label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 5px; }
    .fi .req { color: var(--err); }
    .fi input, .fi textarea, .fi select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--bd); border-radius: 8px;
    }
    .fa { position: absolute; top: 6px; left: 6px; display: none; gap: 3px; }
    .fi:hover .fa, .fi.sel .fa { display: flex; }
    .fa button {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--bd);
      background: #fff; cursor: pointer; font-size: 11px;
    }
    #npanel {
      position: absolute; top: 48px; left: 0; width: 320px; max-height: 380px;
      background: #fff; border: 1px solid var(--bd); border-radius: 12px;
      box-shadow: var(--sh); overflow: auto; z-index: 50;
    }
    #npanel .hd {
      padding: 11px 14px; border-bottom: 1px solid var(--bd); font-weight: 700;
      display: flex; justify-content: space-between; font-size: 14px; position: sticky; top: 0; background: #fff;
    }
    .nit { padding: 11px 14px; border-bottom: 1px solid var(--bd); font-size: 13px; cursor: pointer; }
    .nit:hover { background: var(--bg); }
    .nit.ur { background: #eff6ff; }
    .nit .tm { font-size: 11px; color: var(--mu); margin-top: 2px; }
    #modal {
      position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none;
      align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    #modal.on { display: flex; }
    #modal .box {
      background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
    }
    #modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
    .ma { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    #toasts { position: fixed; bottom: 20px; left: 20px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
    .toast {
      background: #0f172a; color: #f1f5f9; padding: 11px 16px; border-radius: 10px;
      font-size: 13px; box-shadow: var(--sh); animation: up .2s ease;
    }
    .toast.ok { background: var(--ok); }
    .toast.er { background: var(--err); }
    @keyframes up { from { transform: translateY(12px); opacity: 0; } }
    #public { display: none; width: 100%; margin: 0; padding: 0; min-height: 100vh; }
    #public.on { display: block; }
    #public .pubc { max-width: none; margin: 0; border: none; box-shadow: none; border-radius: 0; padding: 0; background: transparent; }
    .pubc {
      background: #fff; border-radius: 16px; padding: 28px; border: 1px solid var(--bd); box-shadow: var(--sh);
    }
    .pubc h1 { font-size: 20px; margin-bottom: 6px; }
    .pubc .ds { color: var(--t2); font-size: 13px; margin-bottom: 20px; }
    .pf { margin-bottom: 16px; }
    .pf label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; }
    .pf input, .pf textarea, .pf select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--bd); border-radius: 8px;
    }
    .okbox { text-align: center; padding: 36px 16px; }
    .okbox .ck { font-size: 44px; color: var(--ok); margin-bottom: 8px; }
    .menu-t { display: none; }
    @media (max-width: 900px) {
      .side { transform: translateX(100%); }
      .side.open { transform: translateX(0); }
      .main { margin-right: 0; }
      .menu-t { display: grid; }
      .bld { grid-template-columns: 1fr; }
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--bg); text-align: right; padding: 9px 10px; font-weight: 600; }
    td { padding: 9px 10px; border-bottom: 1px solid var(--bd); color: var(--t2); }
  </style>
</head>
<body>
<div id="auth">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="m">آ</div>
      <h1>آزمونینو</h1>
      <p>سامانه فرم‌ساز، آزمون‌ساز و جمع‌آوری داده</p>
    </div>
    <div id="authErr" class="auth-err"></div>
    <div id="loginBox">
      <div class="fg"><label>ایمیل</label><input type="email" id="inEmail" placeholder="you@example.com" autocomplete="username" /></div>
      <div class="fg"><label>رمز عبور</label><input type="password" id="inPass" placeholder="••••••••" autocomplete="current-password" /></div>
      <button type="button" class="btn btn-p" id="btnLogin">ورود</button>
      <div class="auth-sw">حساب ندارید؟ <a id="goReg">ثبت‌نام</a></div>
    </div>
    <div id="regBox" class="hidden">
      <div class="fg"><label>نام نمایشی</label><input type="text" id="regName" placeholder="نام شما" /></div>
      <div class="fg"><label>ایمیل</label><input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" /></div>
      <div class="fg"><label>رمز عبور</label><input type="password" id="regPass" placeholder="حداقل ۶ کاراکتر" autocomplete="new-password" /></div>
      <button type="button" class="btn btn-p" id="btnReg">ایجاد حساب</button>
      <div class="auth-sw">قبلاً ثبت‌نام کرده‌اید؟ <a id="goLogin">ورود</a></div>
    </div>
  </div>
</div>
<div id="app">
  <aside class="side" id="side">
    <div class="side-h"><div class="m">آ</div><h2>آزمونینو</h2></div>
    <nav class="side-nav" id="nav">
      <button type="button" class="ni on" data-p="dash">📊 نمای کلی</button>
      <button type="button" class="ni" data-p="projects">📁 پروژه‌های من</button>
      <button type="button" class="ni" data-p="forms">📝 فرم‌ها</button>
      <button type="button" class="ni" data-p="quizzes">✅ آزمون‌ها</button>
      <button type="button" class="ni" data-p="responses">📥 پاسخ‌ها</button>
      <button type="button" class="ni" data-p="notifs">🔔 اعلان‌ها</button>
      <button type="button" class="ni" data-p="support">🛟 پشتیبانی</button>
      <button type="button" class="ni" data-p="settings">⚙️ تنظیمات</button>
    </nav>
    <div class="side-f">
      <div class="uchip">
        <div class="av" id="uAv">ک</div>
        <div><div class="nm" id="uNm">کاربر</div><div class="em" id="uEm">—</div></div>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div style="display:flex;align-items:center;gap:10px">
        <button type="button" class="iconb menu-t" id="btnMenu">☰</button>
        <strong id="topTitle">نمای کلی</strong>
      </div>
      <div class="top-r">
        <button type="button" class="btn btn-p btn-sm" id="btnNew">+ پروژه جدید</button>
        <button type="button" class="iconb" id="btnNotif" title="اعلان‌ها">🔔<span class="badge hidden" id="nBadge">0</span></button>
        <button type="button" class="iconb" id="btnOut" title="خروج">خروج</button>
        <div id="npanel" class="hidden"></div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="public"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toasts"></div>
<script>
(function () {
  "use strict";
  /* ذخیره‌ساز مقاوم برای فایل‌های بازشده با file:// و مرورگرهای محدودکننده */
  var __azNativeStorage=null,__azFallback={},__azPrefix="__AZMOONINO_FALLBACK__:";
  try{__azNativeStorage=window.localStorage;}catch(storageAccessError){__azNativeStorage=null;}
  try{if(window.name&&window.name.indexOf(__azPrefix)===0)__azFallback=JSON.parse(window.name.slice(__azPrefix.length))||{};}catch(storageNameError){__azFallback={};}
  var localStorage={
    getItem:function(k){try{if(__azNativeStorage){var v=__azNativeStorage.getItem(k);if(v!==null)return v;}}catch(e){}return Object.prototype.hasOwnProperty.call(__azFallback,k)?__azFallback[k]:null;},
    setItem:function(k,v){v=String(v);try{if(__azNativeStorage){__azNativeStorage.setItem(k,v);return;}}catch(e){}__azFallback[k]=v;try{window.name=__azPrefix+JSON.stringify(__azFallback);}catch(e){}},
    removeItem:function(k){try{if(__azNativeStorage)__azNativeStorage.removeItem(k);}catch(e){}delete __azFallback[k];try{window.name=__azPrefix+JSON.stringify(__azFallback);}catch(e){}}
  };
  var KEY = "azmoonino_v2";
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return emptyDB();
      var db = JSON.parse(raw);
      if (!db || typeof db !== "object") db = emptyDB();
      ["users", "projects", "responses", "notifs", "tickets"].forEach(function(k) {
        if (!Array.isArray(db[k])) db[k] = [];
      });
      if (!Object.prototype.hasOwnProperty.call(db, "session")) db.session = null;
      return db;
    } catch (e) { return emptyDB(); }
  }
  function emptyDB() {
    return { users: [], session: null, projects: [], responses: [], notifs: [], tickets: [] };
  }
  function save(db) { try { localStorage.setItem(KEY, JSON.stringify(db)); return true; } catch(e) { toast("ذخیره‌سازی انجام نشد؛ فضای مرورگر ممکن است پر یا محدود باشد.","er"); return false; } }
  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return "x" + (h >>> 0).toString(16);
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
  function now() { return new Date().toISOString(); }
  function faDate(iso) {
    try {
      return new Date(iso).toLocaleString("fa-IR", {
        year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return iso || ""; }
  }
  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  var state = { page: "dash", builderId: null, selectedField: null };
  function user() {
    var db = load();
    if (!db.session || !db.session.userId) return null;
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].id === db.session.userId) return db.users[i];
    }
    return null;
  }
  function toast(msg, type) {
    var el = document.createElement("div");
    el.className = "toast" + (type === "ok" ? " ok" : type === "er" ? " er" : "");
    el.textContent = msg;
    document.getElementById("toasts").appendChild(el);
    setTimeout(function () { el.remove(); }, 2800);
  }
  function showErr(msg) {
    var e = document.getElementById("authErr");
    e.textContent = msg;
    e.classList.add("on");
  }
  function hideErr() {
    var e = document.getElementById("authErr");
    e.textContent = "";
    e.classList.remove("on");
  }
  function openModal(html) {
    document.getElementById("modalBox").innerHTML = html;
    document.getElementById("modal").classList.add("on");
  }
  function closeModal() { document.getElementById("modal").classList.remove("on"); }
  function showLogin() {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("regBox").classList.add("hidden");
    hideErr();
  }
  function showReg() {
    document.getElementById("regBox").classList.remove("hidden");
    document.getElementById("loginBox").classList.add("hidden");
    hideErr();
  }
  function doRegister() {
    hideErr();
    var name = document.getElementById("regName").value.trim();
    var email = document.getElementById("regEmail").value.trim().toLowerCase();
    var pass = document.getElementById("regPass").value;
    if (!name) return showErr("نام نمایشی را وارد کنید.");
    if (!email || email.indexOf("@") < 1) return showErr("ایمیل معتبر وارد کنید.");
    if (!pass || pass.length < 6) return showErr("رمز عبور باید حداقل ۶ کاراکتر باشد.");
    var db = load();
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].email === email) return showErr("این ایمیل قبلاً ثبت شده است.");
    }
    var u = { id: uid(), name: name, email: email, pass: hash(pass), avatar: name.charAt(0), createdAt: now() };
    db.users.push(u);
    db.session = { userId: u.id, at: now() };
    db.notifs.push({ id: uid(), userId: u.id, title: "خوش آمدید", body: "حساب شما ساخته شد. اولین پروژه را ایجاد کنید.", read: false, at: now() });
    save(db);
    toast("حساب ساخته شد", "ok");
    enterApp();
  }
  function doLogin() {
    hideErr();
    var email = document.getElementById("inEmail").value.trim().toLowerCase();
    var pass = document.getElementById("inPass").value;
    if (!email || !pass) return showErr("ایمیل و رمز عبور را وارد کنید.");
    var db = load();
    var found = null;
    for (var i = 0; i < db.users.length; i++) {
      if (db.users[i].email === email && db.users[i].pass === hash(pass)) { found = db.users[i]; break; }
    }
    if (!found) return showErr("ایمیل یا رمز عبور نادرست است.");
    db.session = { userId: found.id, at: now() };
    save(db);
    toast("ورود موفق", "ok");
    enterApp();
  }
  function doLogout() {
    var db = load();
    db.session = null;
    save(db);
    document.getElementById("app").classList.remove("on");
    document.getElementById("auth").style.display = "flex";
    showLogin();
  }
  function enterApp() {
    var u = user();
    if (!u) return;
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").classList.add("on");
    document.getElementById("uNm").textContent = u.name;
    document.getElementById("uEm").textContent = u.email;
    document.getElementById("uAv").textContent = u.avatar || u.name.charAt(0);
    updateBadge();
    go("dash");
  }
  var titles = {
    dash: "نمای کلی", projects: "پروژه‌های من", forms: "فرم‌ها", quizzes: "آزمون‌ها",
    responses: "پاسخ‌ها", notifs: "اعلان‌ها", support: "پشتیبانی", settings: "تنظیمات",
    builder: "فرم‌ساز", project: "جزئیات پروژه"
  };
  function go(page, extra) {
    state.page = page;
    if (extra && extra.id) state.builderId = extra.id;
    var nav = document.getElementById("nav").querySelectorAll(".ni");
    for (var i = 0; i < nav.length; i++) {
      nav[i].classList.toggle("on", nav[i].getAttribute("data-p") === page);
    }
    document.getElementById("topTitle").textContent = titles[page] || page;
    document.getElementById("side").classList.remove("open");
    render();
  }
  function render() {
    var u = user();
    if (!u) return;
    var el = document.getElementById("content");
    if (state.page === "dash") renderDash(el, u);
    else if (state.page === "projects" || state.page === "forms" || state.page === "quizzes") renderProjects(el, u);
    else if (state.page === "responses") renderResponses(el, u);
    else if (state.page === "notifs") renderNotifs(el, u);
    else if (state.page === "support") renderSupport(el, u);
    else if (state.page === "settings") renderSettings(el, u);
    else if (state.page === "builder") renderBuilder(el, u);
    else if (state.page === "project") renderProject(el, u);
    else el.innerHTML = '<div class="empty">صفحه یافت نشد</div>';
  }
  function renderDash(el, u) {
    var db = load();
    var projs = db.projects.filter(function (p) { return p.ownerId === u.id; });
    var resps = db.responses.filter(function (r) {
      return projs.some(function (p) { return p.id === r.projectId; });
    });
    var unread = db.notifs.filter(function (n) { return n.userId === u.id && !n.read; }).length;
    var cards = projs.slice().reverse().slice(0, 6).map(projectCard).join("");
    el.innerHTML =
      '<div class="pt">سلام ' + esc(u.name) + '</div>' +
      '<div class="pd">داشبورد آزمونینو</div>' +
      '<div class="grid g4" style="margin-bottom:18px">' +
        '<div class="stat"><div class="l">پروژه‌ها</div><div class="v">' + projs.length + '</div></div>' +
        '<div class="stat"><div class="l">پاسخ‌ها</div><div class="v">' + resps.length + '</div></div>' +
        '<div class="stat"><div class="l">اعلان خوانده‌نشده</div><div class="v">' + unread + '</div></div>' +
        '<div class="stat"><div class="l">منتشرشده</div><div class="v">' + projs.filter(function(p){return p.status==="published";}).length + '</div></div>' +
      '</div>' +
      '<div style="margin-bottom:16px"><button type="button" class="btn btn-p" id="dashNew" style="width:auto">+ ساخت پروژه جدید</button></div>' +
      '<div class="card"><div class="ct">پروژه‌های اخیر</div>' +
      (projs.length === 0
        ? '<div class="empty"><div class="b">📁</div><p>هنوز پروژه‌ای ندارید.</p></div>'
        : '<div class="grid g3">' + cards + '</div>') +
      '</div>';
    var bn = document.getElementById("dashNew");
    if (bn) bn.onclick = openCreate;
    bindProjectCards(el);
  }
  function projectCard(p) {
    var ty = { form: "فرم", quiz: "آزمون", survey: "نظرسنجی" }[p.type] || p.type;
    var st = { draft: "پیش‌نویس", published: "منتشرشده", closed: "بسته" }[p.status] || p.status;
    var dc = p.status === "published" ? "dot-p" : p.status === "closed" ? "dot-c" : "dot-d";
    return (
      '<div class="pcard" data-id="' + p.id + '">' +
        '<span class="ty">' + ty + '</span>' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<div class="meta">' +
          '<span><span class="dot ' + dc + '"></span>' + st + '</span>' +
          '<span>' + (p.fields ? p.fields.length : 0) + ' فیلد</span>' +
          '<span>' + faDate(p.updatedAt || p.createdAt) + '</span>' +
        '</div></div>'
    );
  }
  function bindProjectCards(root) {
    var cards = root.querySelectorAll(".pcard");
    for (var i = 0; i < cards.length; i++) {
      cards[i].onclick = (function (id) {
        return function () { state.builderId = id; go("project"); };
      })(cards[i].getAttribute("data-id"));
    }
  }
  function renderProjects(el, u) {
    var db = load();
    var list = db.projects.filter(function (p) { return p.ownerId === u.id; });
    if (state.page === "forms") list = list.filter(function (p) { return p.type === "form" || p.type === "survey"; });
    if (state.page === "quizzes") list = list.filter(function (p) { return p.type === "quiz"; });
    el.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">' +
        '<div><div class="pt">' + esc(titles[state.page]) + '</div><div class="pd">' + list.length + ' مورد</div></div>' +
        '<button type="button" class="btn btn-p" id="listNew" style="width:auto">+ پروژه جدید</button>' +
      '</div>' +
      (list.length === 0
        ? '<div class="card"><div class="empty"><div class="b">📂</div>موردی نیست</div></div>'
        : '<div class="grid g3">' + list.slice().reverse().map(projectCard).join("") + '</div>');
    var bn = document.getElementById("listNew");
    if (bn) bn.onclick = openCreate;
    bindProjectCards(el);
  }
  function openCreate() {
    openModal(
      '<h3>ساخت پروژه جدید</h3>' +
      '<div class="fg"><label>عنوان</label><input id="npTitle" placeholder="مثلاً ثبت‌نام کارگاه" /></div>' +
      '<div class="fg"><label>نوع</label><select id="npType">' +
        '<option value="form">فرم</option><option value="quiz">آزمون</option><option value="survey">نظرسنجی</option>' +
      '</select></div>' +
      '<div class="fg"><label>توضیح (اختیاری)</label><textarea id="npDesc" rows="2"></textarea></div>' +
      '<div class="ma">' +
        '<button type="button" class="btn btn-p" id="npGo" style="width:auto">ایجاد و باز کردن فرم‌ساز</button>' +
        '<button type="button" class="btn btn-s" id="npCancel">انصراف</button>' +
      '</div>'
    );
    document.getElementById("npCancel").onclick = closeModal;
    document.getElementById("npGo").onclick = function () {
      var title = document.getElementById("npTitle").value.trim();
      var type = document.getElementById("npType").value;
      var desc = document.getElementById("npDesc").value.trim();
      if (!title) { toast("عنوان الزامی است", "er"); return; }
      var u = user();
      var db = load();
      var p = {
        id: uid(), ownerId: u.id, title: title, type: type, description: desc,
        status: "draft", fields: [], publicId: uid().slice(0, 10),
        createdAt: now(), updatedAt: now()
      };
      db.projects.push(p);
      db.notifs.push({ id: uid(), userId: u.id, title: "پروژه ایجاد شد", body: "«" + title + "» ساخته شد.", read: false, at: now() });
      save(db);
      closeModal();
      toast("پروژه ایجاد شد", "ok");
      state.builderId = p.id;
      go("builder");
    };
  }
  function renderProject(el, u) {
    var db = load();
    var p = null;
    for (var i = 0; i < db.projects.length; i++) {
      if (db.projects[i].id === state.builderId && db.projects[i].ownerId === u.id) { p = db.projects[i]; break; }
    }
    if (!p) { el.innerHTML = '<div class="empty">پروژه پیدا نشد</div>'; return; }
    var resps = db.responses.filter(function (r) { return r.projectId === p.id; });
    var link = location.href.split("?")[0] + "?f=" + p.publicId;
    var rows = resps.slice().reverse().slice(0, 25).map(function (r) {
      return "<tr><td>" + faDate(r.at) + "</td><td>" + esc(sumResp(r, p)) + "</td></tr>";
    }).join("");
    el.innerHTML =
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">' +
        '<div><div class="pt">' + esc(p.title) + '</div>' +
        '<div class="pd">' + esc(p.description || "بدون توضیح") + " · " +
          (p.status === "published" ? "منتشرشده" : p.status === "closed" ? "بسته" : "پیش‌نویس") +
        "</div></div>" +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-s btn-sm" id="pdEdit">ویرایش فرم</button>' +
          (p.status !== "published"
            ? '<button type="button" class="btn btn-p btn-sm" id="pdPub">انتشار</button>'
            : '<button type="button" class="btn btn-s btn-sm" id="pdCopy">کپی لینک</button>' +
              '<button type="button" class="btn btn-s btn-sm" id="pdClose">بستن فرم</button>') +
          '<button type="button" class="btn btn-d btn-sm" id="pdDel">حذف</button>' +
        "</div></div>" +
      '<div class="grid g4" style="margin-bottom:16px">' +
        '<div class="stat"><div class="l">فیلدها</div><div class="v">' + (p.fields ? p.fields.length : 0) + '</div></div>' +
        '<div class="stat"><div class="l">پاسخ‌ها</div><div class="v">' + resps.length + '</div></div>' +
        '<div class="stat"><div class="l">وضعیت</div><div class="v" style="font-size:16px">' +
          (p.status === "published" ? "فعال" : "غیرفعال") + '</div></div></div>' +
      (p.status === "published"
        ? '<div class="card" style="margin-bottom:14px"><div class="ct">لینک عمومی</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<input readonly value="' + esc(link) + '" style="flex:1;padding:9px;border:1px solid var(--bd);border-radius:8px;font-size:12px" id="linkInp" />' +
          '<button type="button" class="btn btn-p btn-sm" id="pdCopy2">کپی</button></div>' +
          '<p style="font-size:12px;color:var(--mu);margin-top:6px">نسخه آفلاین است: لینک فقط در مرورگری کار می‌کند که اطلاعات این پروژه در همان مرورگر ذخیره شده باشد. برای دریافت پاسخ از دستگاه‌های دیگر، نسخه سروری لازم است.</p></div>'
        : "") +
      '<div class="card"><div class="ct">پاسخ‌های دریافتی</div>' +
      (resps.length === 0
        ? '<div class="empty">هنوز پاسخی نیست</div>'
        : '<table><thead><tr><th>زمان</th><th>خلاصه</th></tr></thead><tbody>' + rows + '</tbody></table>') +
      "</div>";
    document.getElementById("pdEdit").onclick = function () { go("builder"); };
    var pub = document.getElementById("pdPub");
    if (pub) pub.onclick = function () { publish(p.id); };
    var cp = document.getElementById("pdCopy");
    if (cp) cp.onclick = function () { copyText(link); };
    var cp2 = document.getElementById("pdCopy2");
    if (cp2) cp2.onclick = function () { copyText(link); };
    var cl = document.getElementById("pdClose");
    if (cl) cl.onclick = function () {
      var d = load();
      for (var i = 0; i < d.projects.length; i++) {
        if (d.projects[i].id === p.id) { d.projects[i].status = "closed"; d.projects[i].updatedAt = now(); }
      }
      save(d);
      toast("فرم بسته شد", "ok");
      render();
    };
    document.getElementById("pdDel").onclick = function () {
      if (!confirm("پروژه حذف شود؟ این عمل قابل بازگشت نیست.")) return;
      var d = load();
      d.projects = d.projects.filter(function (x) { return x.id !== p.id; });
      d.responses = d.responses.filter(function (x) { return x.projectId !== p.id; });
      save(d);
      toast("حذف شد", "ok");
      go("projects");
    };
  }
  function sumResp(r, p) {
    var parts = [];
    var fields = p.fields || [];
    for (var i = 0; i < Math.min(3, fields.length); i++) {
      var v = r.answers && r.answers[fields[i].id];
      if (v != null && v !== "") parts.push(String(v).slice(0, 40));
    }
    return parts.join(" · ") || "—";
  }
  function publish(id) {
    var db = load();
    var p = null;
    for (var i = 0; i < db.projects.length; i++) {
      if (db.projects[i].id === id) { p = db.projects[i]; break; }
    }
    if (!p) return;
    if (!p.fields || p.fields.length === 0) { toast("حداقل یک فیلد اضافه کنید", "er"); return; }
    p.status = "published";
    p.updatedAt = now();
    db.notifs.push({ id: uid(), userId: p.ownerId, title: "فرم منتشر شد", body: "«" + p.title + "» منتشر شد و لینک فعال است.", read: false, at: now() });
    save(db);
    toast("منتشر شد", "ok");
    render();
  }
  function copyText(t) {
    t = String(t == null ? '' : t);
    if (!t) { toast('چیزی برای کپی‌کردن وجود ندارد.', 'er'); return; }
    // remove any previous stuck copy helper
    var old = document.getElementById('azCopyHelper');
    if (old) old.remove();
    function showManualCopy() {
      var wrap = document.createElement('div');
      wrap.id = 'azCopyHelper';
      wrap.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
      wrap.innerHTML =
        '<div style="background:#fff;color:#111;border-radius:14px;padding:18px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);direction:rtl;font-family:Tahoma,system-ui,sans-serif">' +
        '<div style="font-weight:800;margin-bottom:8px">کپی لینک</div>' +
        '<p style="font-size:13px;color:#475569;margin-bottom:10px">متن زیر را انتخاب و کپی کنید (Ctrl+C یا Cmd+C).</p>' +
        '<textarea id="azCopyTa" readonly style="width:100%;height:90px;padding:10px;border:2px solid #2563eb;border-radius:10px;font-size:14px;direction:ltr;text-align:left"></textarea>' +
        '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button type="button" id="azCopySelect" style="background:#2563eb;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit">انتخاب متن</button>' +
        '<button type="button" id="azCopyClose" style="background:#e2e8f0;color:#0f172a;border:none;padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit">بستن</button>' +
        '</div></div>';
      document.body.appendChild(wrap);
      var ta = document.getElementById('azCopyTa');
      ta.value = t;
      ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
      document.getElementById('azCopySelect').onclick = function () { ta.focus(); ta.select(); ta.setSelectionRange(0, t.length); };
      document.getElementById('azCopyClose').onclick = function () { wrap.remove(); };
      wrap.onclick = function (e) { if (e.target === wrap) wrap.remove(); };
    }
    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;right:-9999px;opacity:0;font-size:16px';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      if (ok) toast('لینک با موفقیت کپی شد.', 'ok');
      else { toast('کپی خودکار پشتیبانی نشد؛ متن را دستی کپی کنید.', 'er'); showManualCopy(); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('لینک با موفقیت کپی شد.', 'ok'); }).catch(fallbackCopy);
    } else fallbackCopy();
  }
  var FIELD_TYPES = [
    { t: "text", l: "متن کوتاه", i: "✏️" },
    { t: "textarea", l: "متن بلند", i: "📄" },
    { t: "email", l: "ایمیل", i: "📧" },
    { t: "number", l: "عدد", i: "🔢" },
    { t: "select", l: "فهرست کشویی", i: "▼" },
    { t: "radio", l: "تک‌گزینه‌ای", i: "◯" },
    { t: "checkbox", l: "چندگزینه‌ای", i: "☑" },
    { t: "date", l: "تاریخ", i: "📅" },
    { t: "rating", l: "امتیاز", i: "⭐" }
  ];
  function getProj() {
    var db = load();
    var u = user();
    for (var i = 0; i < db.projects.length; i++) {
      if (db.projects[i].id === state.builderId && db.projects[i].ownerId === u.id) return db.projects[i];
    }
    return null;
  }
  function saveFields(fields) {
    var db = load();
    for (var i = 0; i < db.projects.length; i++) {
      if (db.projects[i].id === state.builderId) {
        db.projects[i].fields = fields;
        db.projects[i].updatedAt = now();
        break;
      }
    }
    save(db);
  }
  function renderBuilder(el, u) {
    var p = getProj();
    if (!p) { el.innerHTML = '<div class="empty">پروژه پیدا نشد</div>'; return; }
    state.selectedField = null;
    var lib = FIELD_TYPES.map(function (f) {
      return '<button type="button" data-t="' + f.t + '">' + f.i + " " + f.l + "</button>";
    }).join("");
    el.innerHTML =
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">' +
        '<div><div class="pt">فرم‌ساز: ' + esc(p.title) + '</div>' +
        '<div class="pd">فیلد اضافه کنید · ذخیره خودکار</div></div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-s btn-sm" id="bBack">بازگشت</button>' +
          (p.status !== "published" ? '<button type="button" class="btn btn-p btn-sm" id="bPub">انتشار</button>' : "") +
        "</div></div>" +
      '<div class="bld">' +
        '<div class="bp flib"><div style="font-weight:700;font-size:12px;margin-bottom:8px;color:var(--t2)">کتابخانه فیلدها</div>' + lib + "</div>" +
        '<div class="bp" id="canvas"></div>' +
        '<div class="bp"><div style="font-weight:700;font-size:12px;margin-bottom:8px;color:var(--t2)">تنظیمات فیلد</div><div id="props" style="color:var(--mu);font-size:13px">یک فیلد را انتخاب کنید</div></div>' +
      "</div>";
    document.getElementById("bBack").onclick = function () { go("project"); };
    var bp = document.getElementById("bPub");
    if (bp) bp.onclick = function () { publish(p.id); go("project"); };
    var libBtns = el.querySelectorAll(".flib button");
    for (var i = 0; i < libBtns.length; i++) {
      libBtns[i].onclick = (function (t) { return function () { addField(t); }; })(libBtns[i].getAttribute("data-t"));
    }
    drawCanvas();
  }
  function addField(type) {
    var p = getProj();
    if (!p) return;
    var label = "فیلد جدید";
    for (var i = 0; i < FIELD_TYPES.length; i++) {
      if (FIELD_TYPES[i].t === type) { label = FIELD_TYPES[i].l; break; }
    }
    var f = {
      id: uid(), type: type, label: label, required: false, placeholder: "",
      options: (type === "select" || type === "radio" || type === "checkbox") ? ["گزینه ۱", "گزینه ۲"] : []
    };
    var fields = (p.fields || []).slice();
    fields.push(f);
    saveFields(fields);
    state.selectedField = f.id;
    drawCanvas();
    drawProps();
    toast("فیلد اضافه شد", "ok");
  }
  function drawCanvas() {
    var canvas = document.getElementById("canvas");
    if (!canvas) return;
    var p = getProj();
    if (!p) return;
    var fields = p.fields || [];
    if (fields.length === 0) {
      canvas.innerHTML = '<div class="empty"><div class="b">🧩</div><p>از سمت راست فیلد اضافه کنید</p></div>';
      return;
    }
    var html = "";
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      var sel = state.selectedField === f.id ? " sel" : "";
      html +=
        '<div class="fi' + sel + '" data-id="' + f.id + '">' +
          '<div class="fa">' +
            '<button type="button" data-a="up" title="بالا">↑</button>' +
            '<button type="button" data-a="dn" title="پایین">↓</button>' +
            '<button type="button" data-a="rm" title="حذف">🗑</button>' +
          "</div>" +
          "<label>" + esc(f.label) + (f.required ? ' <span class="req">*</span>' : "") + "</label>" +
          fieldPreview(f) +
        "</div>";
    }
    canvas.innerHTML = html;
    var items = canvas.querySelectorAll(".fi");
    for (var j = 0; j < items.length; j++) {
      items[j].onclick = (function (id) {
        return function (e) {
          if (e.target.closest && e.target.closest(".fa")) return;
          state.selectedField = id;
          drawCanvas();
          drawProps();
        };
      })(items[j].getAttribute("data-id"));
      var acts = items[j].querySelectorAll(".fa button");
      for (var k = 0; k < acts.length; k++) {
        acts[k].onclick = (function (id, a) {
          return function (e) {
            e.stopPropagation();
            if (a === "rm") removeField(id);
            else if (a === "up") moveField(id, -1);
            else if (a === "dn") moveField(id, 1);
          };
        })(items[j].getAttribute("data-id"), acts[k].getAttribute("data-a"));
      }
    }
  }
  function fieldPreview(f) {
    if (f.type === "textarea")

  function moveField(id, dir) {
    var p = getProj();
    if (!p) return;
    var fields = (p.fields || []).slice();
    var idx = -1;
    for (var i = 0; i < fields.length; i++) if (fields[i].id === id) { idx = i; break; }
    var n = idx + dir;
    if (n < 0 || n >= fields.length) return;
    var tmp = fields[idx];
    fields[idx] = fields[n];

    saveFields(fields);
    drawCanvas();

      (async function(){

          var answers={};
          for(var i=0;i<flds.length;i++){
            var f=flds[i];if(f.type==='title'||f.type==='note')continue;

              for(var j=0;j<files.length;j++){

                var data=file.type.startsWith('image/')?await readImageCompressed(file,1000,0.72):await new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=reject;r.readAsDataURL(file);});

          if(p.type==='quiz'){
            var score=0,max=0,grading=[];
            flds.forEach(function(f){if(f.correctAnswer==null||f.correctAnswer===''||(Array.isArray(f.correctAnswer)&&!f.correctAnswer.length))return;var pts=Number(f.points)||1;max+=pts;var val=answers[f.id],ok=false;
              if(f.type==='checkbox'){var a=Array.isArray(val)?val.slice().sort():[],b=(Array.isArray(f.correctAnswer)?f.correctAnswer:String(f.correctAnswer).split('||')).slice().sort();ok=a.length===b.length&&a.every(function(x,i){return x===b[i];});}

          var resultText=p.type==='quiz'?(response.maxScore?'نمره شما: '+response.score+' از '+response.maxScore:'پاسخ ثبت شد؛ برای سؤال‌ها کلید تصحیح تعیین نشده است.'):'از مشارکت شما سپاسگزاریم.';

        }catch(err){toast(err.message||'ثبت پاسخ ناموفق بود','er');submit.disabled=false;submit.textContent='ثبت پاسخ';}

      started=Date.now();
      interval=setInterval(function(){
        var remaining=Math.max(0,st.duration*60-Math.floor((Date.now()-started)/1000));
        var tm=document.getElementById('azTimer');
        if(tm)tm.textContent='⏱ زمان باقی‌مانده: '+Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');
        if(remaining<=0){clearInterval(interval);toast('زمان آزمون به پایان رسید.','er');finishQuiz(true);}
      },1000);
    }
    function collectFromForm(form){
      fields.forEach(function(f){
        if(f.type==='title'||f.type==='note')return;
        if(f.type==='checkbox'){
          answersCache[f.id]=Array.prototype.slice.call(form.querySelectorAll('input[name="'+f.id+'"]:checked')).map(function(x){return x.value;}).join(', ');
        }else{
          var inp=form.elements[f.id];
          answersCache[f.id]=inp?inp.value:'';
        }
      });
    }
    function finishQuiz(autoEnd){
      if(submitted)return;
      var form=document.getElementById('pubForm');
      if(form)collectFromForm(form);
      if(!autoEnd&&form&&!form.reportValidity())return;
      submitted=true;
      if(interval)clearInterval(interval);
      var answers=answersCache;
      var grade=p.type==='quiz'&&st.grading!=='manual'?azGrade(p,answers):null;
      var response={id:uid(),projectId:p.id,answers:answers,at:now(),participantName:participantName||'',gradingStatus:st.grading==='manual'?'در انتظار تصحیح':(grade&&grade.manual.length?'نیازمند بررسی دستی':'تصحیح خودکار'),score:grade?grade.score:null,total:grade?grade.total:null,manualFields:grade?grade.manual:[]};
      var d=load();d.responses.push(response);save(d);
      if(p.type==='quiz'){try{localStorage.setItem(attemptKey,String(attempts+1));}catch(e){}}
      var percent=grade&&grade.total?Math.round(grade.score/grade.total*100):0;
      var passed=grade&&grade.total?percent>=st.passScore:false;
      var msg='<div style="padding:36px 24px;text-align:center">'+
        '<div style="font-size:48px;margin-bottom:8px">'+(p.type==='quiz'&&st.showResult&&grade?(passed?'🏆':'📋'):'✓')+'</div>'+
        '<h2 style="font-size:22px;margin-bottom:8px">پاسخ شما ثبت شد</h2>';
      if(participantName)msg+='<p style="opacity:.8">'+esc(participantName)+'</p>';
      if(p.type==='quiz'&&st.showResult&&grade&&st.grading!=='manual'){
        msg+='<div style="margin:18px auto;max-width:280px;padding:16px;border-radius:14px;background:'+(th.accentSoft||'#f1f5f9')+'"><div style="font-size:28px;font-weight:900;color:'+th.accent+'">'+grade.score+' / '+grade.total+'</div><div style="font-size:14px;margin-top:4px">'+percent+'٪</div><div style="margin-top:8px;font-weight:700">'+(passed?'حد نصاب قبولی کسب شد ✓':'حد نصاب قبولی کسب نشد')+'</div></div>';
        if(grade.manual.length)msg+='<p style="font-size:13px;opacity:.8">برخی سؤال‌ها نیازمند بررسی دستی هستند.</p>';
      }else if(p.type==='quiz'){
        msg+='<p style="opacity:.85">'+(st.grading==='manual'?'نتیجه پس از تصحیح سازنده اعلام می‌شود.':'نتیجه ثبت شد.')+'</p>';
      }
      if(st.endMessage)msg+='<p style="margin-top:12px;white-space:pre-wrap">'+esc(st.endMessage)+'</p>';
      else msg+='<p style="margin-top:12px;opacity:.75">از شرکت شما سپاسگزاریم.</p>';
      if(st.showAnswersAfter&&p.type==='quiz'&&grade){
        msg+='<div style="text-align:right;margin-top:24px;padding-top:16px;border-top:1px solid '+(th.ink==='#f1f5f9'||th.ink==='#e2e8f0'?'#334155':'#e2e8f0')+'"><strong>پاسخ‌های صحیح:</strong>';
        fields.forEach(function(f,i){
          if(f.type==='title'||f.type==='note')return;
          var correct=f.type==='checkbox'?(f.correctAnswers||[]).join('، '):(f.correctAnswer||'—');
          var userAns=answers[f.id]||'—';
          msg+='<div style="margin:10px 0;font-size:13px"><b>'+(i+1)+'. '+esc(f.label)+'</b><br>پاسخ شما: '+esc(String(userAns))+'<br>پاسخ صحیح: '+esc(String(correct))+'</div>';
        });
        msg+='</div>';
      }
      msg+='</div>';
      view.innerHTML=wrapShell(headerBlock()+'<div>'+msg+'</div>');
    }
    function showExam(){
      var timerBit=st.duration?'<div id="azTimer" style="display:inline-flex;margin-top:12px;background:rgba(255,255,255,.22);padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px">⏱ زمان باقی‌مانده: '+st.duration+':00</div>':'';
      if(st.oneByOne&&fields.length){
        qIndex=0;
        function paintOne(){
          var f=fields[qIndex];
          var body=progressHtml(qIndex+1,fields.length)+'<div style="padding:22px 24px"><form id="pubForm">'+renderQ(f,qIndex)+
            '<div style="margin-top:22px;display:flex;gap:8px;flex-wrap:wrap">'+
            (qIndex>0?'<button type="button" class="btn btn-s" id="azPrevQ">سؤال قبلی</button>':'')+
            (qIndex<fields.length-1?'<button type="button" class="btn btn-p" id="azNextQ" style="background:'+th.accent+';color:'+(th.btnText||'#fff')+';border:none">سؤال بعدی</button>':
            '<button type="submit" class="btn btn-p" style="background:'+th.accent+';color:'+(th.btnText||'#fff')+';border:none;padding:12px 22px;border-radius:12px;font-weight:700">ثبت نهایی</button>')+
            '</div></form></div>';
          view.innerHTML=wrapShell(headerBlock(timerBit)+body);
          var form=document.getElementById('pubForm');
          // restore cached answer
          var cached=answersCache[f.id];
          if(cached!=null&&form){
            if(f.type==='checkbox'){
              String(cached).split(', ').forEach(function(v){
                Array.prototype.forEach.call(form.querySelectorAll('input[name="'+f.id+'"]'),function(el){if(el.value===v)el.checked=true;});
              });
            }else if(form.elements[f.id])form.elements[f.id].value=cached;
          }
          var next=document.getElementById('azNextQ');
          if(next)next.onclick=function(){collectFromForm(form);if(f.required){var v=answersCache[f.id];if(v==null||v===''){toast('این سؤال الزامی است','er');return;}}qIndex++;paintOne();};
          var prev=document.getElementById('azPrevQ');
          if(prev)prev.onclick=function(){collectFromForm(form);qIndex--;paintOne();};
          form.onsubmit=function(e){e.preventDefault();collectFromForm(form);finishQuiz(false);};
        }
        paintOne();
      }else{
        var fieldsHtml=fields.map(function(f,i){return renderQ(f,i);}).join('');
        view.innerHTML=wrapShell(headerBlock(timerBit)+progressHtml(fields.length,fields.length)+'<div style="padding:22px 24px"><form id="pubForm">'+fieldsHtml+
          '<div style="margin-top:28px;padding-top:18px;border-top:1px solid '+(th.ink==='#f1f5f9'||th.ink==='#e2e8f0'?'#334155':'#e2e8f0')+'"><button type="submit" class="btn btn-p" style="background:'+th.accent+';color:'+(th.btnText||'#fff')+';border:none;padding:14px 28px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px '+th.accent+'55">ثبت '+(p.type==='quiz'?'آزمون':'پاسخ')+'</button></div></form></div>');
        document.getElementById('pubForm').onsubmit=function(e){e.preventDefault();finishQuiz(false);};
      }
      startTimer();
    }
    // Welcome / name gate
    var needWelcome=!!(st.welcome||st.requireName);
    if(needWelcome){
      view.innerHTML=wrapShell(headerBlock()+
        '<div style="padding:28px 24px">'+
        (st.welcome?'<p style="white-space:pre-wrap;line-height:1.7;margin-bottom:16px">'+esc(st.welcome)+'</p>':'')+
        (st.requireName?'<div class="fg"><label>نام و نام خانوادگی</label><input id="azPartName" type="text" placeholder="نام خود را وارد کنید" style="width:100%;padding:11px 13px;border:1px solid var(--bd,#e2e8f0);border-radius:10px"></div>':'')+
        (st.duration?'<p style="font-size:13px;opacity:.8;margin:10px 0">مدت آزمون: '+st.duration+' دقیقه</p>':'')+
        '<button type="button" id="azStartExam" class="btn btn-p" style="background:'+th.accent+';color:'+(th.btnText||'#fff')+';border:none;padding:12px 24px;border-radius:12px;font-weight:700;margin-top:8px">شروع آزمون</button></div>');
      document.getElementById('azStartExam').onclick=function(){
        if(st.requireName){
          var n=document.getElementById('azPartName');
          participantName=n?n.value.trim():'';
          if(!participantName){toast('لطفاً نام خود را وارد کنید','er');return;}
        }
        showExam();
      };
    }else{
      showExam();
    }
    return true;
  };

  /* ابزار تصحیح دستی و مشاهده وضعیت هر شرکت‌کننده */
  var _azRenderProject=renderProject;
  renderProject=function(el,u){
    _azRenderProject(el,u);var p=getProj();if(!p)return;
    // QR + share for published
    if(p.status==='published'){
      var link=location.href.split('?')[0]+'?f='+p.publicId;
      var qrBox=document.createElement('div');
      qrBox.className='card';
      qrBox.style.marginTop='14px';
      qrBox.innerHTML='<div class="ct">اشتراک‌گذاری و QR</div>'+
        '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">'+
        '<img alt="QR" width="140" height="140" style="border-radius:10px;background:#fff;border:1px solid var(--bd)" src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data='+encodeURIComponent(link)+'" />'+
        '<div style="flex:1;min-width:200px"><p style="font-size:13px;color:var(--t2);margin-bottom:8px">لینک عمومی را با QR یا کپی به اشتراک بگذارید.</p>'+
        '<button type="button" class="btn btn-p btn-sm" id="azCopyLinkAgain">کپی لینک</button> '+
        '<button type="button" class="btn btn-s btn-sm" id="azOpenPublic">باز کردن لینک</button></div></div>';
      el.appendChild(qrBox);
      var c1=document.getElementById('azCopyLinkAgain');if(c1)c1.onclick=function(){copyText(link);};
      var c2=document.getElementById('azOpenPublic');if(c2)c2.onclick=function(){window.open(link,'_blank');};
    }
    if(p.type!=='quiz')return;
    var db=load(),rs=db.responses.filter(function(r){return r.projectId===p.id;});
    var table=el.querySelector('.card table');if(!table)return;
    var head=table.querySelector('thead tr');if(head){var th=document.createElement('th');th.textContent='تصحیح';head.appendChild(th);}
    var trs=table.querySelectorAll('tbody tr');
    rs.slice().reverse().slice(0,25).forEach(function(r,i){var tr=trs[i];if(!tr)return;var td=document.createElement('td');var status=r.gradingStatus||'ثبت‌شده';var who=r.participantName?' · '+esc(r.participantName):'';td.innerHTML='<span style="font-size:11px">'+esc(status)+who+'</span> <button type="button" class="btn btn-s btn-sm" data-grade="'+r.id+'">'+(status==='تصحیح‌شده'?'مشاهده/ویرایش':'تصحیح')+'</button>';tr.appendChild(td);});
    Array.prototype.forEach.call(el.querySelectorAll('[data-grade]'),function(btn){btn.onclick=function(){azOpenManualGrade(p.id,btn.getAttribute('data-grade'));};});
  };
  function azOpenManualGrade(projectId,responseId){
    var d=load(),p=d.projects.find(function(x){return x.id===projectId;}),r=d.responses.find(function(x){return x.id===responseId;});if(!p||!r)return;
    var html='<h3>تصحیح پاسخ آزمون</h3><p style="font-size:12px;color:var(--mu)">'+esc(p.title)+' · '+faDate(r.at)+'</p><div style="max-height:55vh;overflow:auto">';
    (p.fields||[]).forEach(function(f,i){var max=Number(f.points==null?1:f.points)||0;var ans=r.answers?r.answers[f.id]:'';html+='<div class="fg" style="border-bottom:1px solid var(--bd);padding:8px 0"><strong>'+ (i+1)+'. '+esc(f.label)+'</strong><div style="font-size:13px;margin:5px 0;white-space:pre-wrap">پاسخ: '+esc(Array.isArray(ans)?ans.join('، '):ans||'—')+'</div><label>نمره کسب‌شده (از '+max+')</label><input type="number" min="0" max="'+max+'" step="0.25" data-manual-points="'+f.id+'" value="'+(r.manualMarks&&r.manualMarks[f.id]!=null?r.manualMarks[f.id]:(r.manualFields&&r.manualFields.indexOf(f.id)<0&&r.score!=null?max:0))+'"></div>';});
    html+='</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn btn-p" id="azSaveManual">ذخیره تصحیح</button><button type="button" class="btn btn-s" id="azCancelManual">انصراف</button></div>';
    openModal(html);document.getElementById('azCancelManual').onclick=closeModal;
    document.getElementById('azSaveManual').onclick=function(){var marks={},sum=0,total=0;Array.prototype.forEach.call(document.querySelectorAll('[data-manual-points]'),function(inp){var id=inp.getAttribute('data-manual-points'),f=p.fields.find(function(x){return x.id===id;}),max=f?Number(f.points==null?1:f.points)||0:0,v=Math.max(0,Math.min(max,Number(inp.value)||0));marks[id]=v;sum+=v;total+=max;});
      var fresh=load(),target=fresh.responses.find(function(x){return x.id===responseId;});if(!target)return;target.manualMarks=marks;target.score=sum;target.total=total;target.gradingStatus='تصحیح‌شده';target.gradedAt=now();save(fresh);closeModal();toast('تصحیح ذخیره شد','ok');render();};
  }

  /* اگر صفحه با لینک آزمون باز شده، نسخه زمان‌بندی‌شده را دوباره اعمال کن. */
  if(new URLSearchParams(location.search).get('f'))tryPublic();

  /* مسیر ساده و سازگار با موبایل: فرم ساخت داخل صفحه، بدون focus خودکار */
  openCreate = function(forceType){
    var content=document.getElementById('content');
    if(!content)return;
    var old=document.getElementById('azCreatePanel');
    if(old)old.remove();
    var preferred=forceType || (state.page==='quizzes'?'quiz':state.page==='forms'?'form':'form');
    var panel=document.createElement('section');
    panel.id='azCreatePanel';
    panel.className='card';
    panel.style.cssText='margin:0 0 18px;padding:18px;border:2px solid var(--p);position:relative;z-index:2;';
    panel.innerHTML=
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap">'+
        '<h3 style="font-size:17px;font-weight:800">'+(preferred==='quiz'?'ساخت آزمون جدید':'ساخت پروژه جدید')+'</h3>'+
        '<button type="button" class="btn btn-s btn-sm" id="azCreateCancel">بستن</button></div>'+
      '<div class="fg"><label for="azCreateTitle">عنوان پروژه</label><input id="azCreateTitle" type="text" autocomplete="off" placeholder="مثلاً آزمون فصل اول"></div>'+
      '<div class="fg"><label for="azCreateType">نوع</label><select id="azCreateType">'+
        '<option value="form" '+(preferred==='form'?'selected':'')+'>فرم</option>'+
        '<option value="quiz" '+(preferred==='quiz'?'selected':'')+'>آزمون</option>'+
        '<option value="survey">نظرسنجی</option></select></div>'+
      '<div class="fg"><label for="azCreateDesc">توضیحات (اختیاری)</label><textarea id="azCreateDesc" rows="2" placeholder="توضیح کوتاه"></textarea></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-p" id="azCreateSubmit" style="width:auto">ایجاد و ورود به ویرایشگر</button></div>';
    content.insertBefore(panel,content.firstChild);
    panel.scrollIntoView({behavior:'smooth',block:'start'});
  };

  function azCreateProject(){
    var titleNode=document.getElementById('azCreateTitle');
    var typeNode=document.getElementById('azCreateType');
    var descNode=document.getElementById('azCreateDesc');
    var title=titleNode?titleNode.value.trim():'';
    if(!title){toast('لطفاً عنوان پروژه را وارد کنید.','er');return;}
    var current=user();
    if(!current){toast('نشست کاربری پیدا نشد؛ یک‌بار خارج و دوباره وارد شوید.','er');return;}
    var db=load();
    if(!Array.isArray(db.projects))db.projects=[];
    if(!Array.isArray(db.notifs))db.notifs=[];
    var type=typeNode?typeNode.value:'form';
    var stamp=now();
    var project={id:uid(),ownerId:current.id,title:title,type:type,description:descNode?descNode.value.trim():'',status:'draft',fields:[],settings:type==='quiz'?{theme:'classic',duration:0,opensAt:'',closesAt:'',grading:'auto',shuffle:false,showResult:true,attempts:1,instructions:'',passScore:50}:undefined,publicId:uid().slice(0,10),createdAt:stamp,updatedAt:stamp};
    db.projects.push(project);
    db.notifs.push({id:uid(),userId:current.id,title:type==='quiz'?'آزمون ساخته شد':'پروژه ساخته شد',body:'«'+title+'» ساخته شد.',read:false,at:stamp});
    if(!save(db)){toast('ذخیره پروژه انجام نشد.','er');return;}
    state.builderId=project.id;
    state.selectedField=null;
    toast(type==='quiz'?'آزمون ساخته شد':'پروژه ساخته شد','ok');
    go('builder');
  }

  /* رویدادگیری واحد؛ از اجرای چندباره کلیک‌هندلرهای قدیمی جلوگیری می‌کند. */
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('#btnNew,#dashNew,#listNew,#azCreateCancel,#azCreateSubmit'):null;
    if(!t)return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    if(t.id==='btnNew'||t.id==='dashNew'||t.id==='listNew'){
      var kind=state.page==='quizzes'?'quiz':state.page==='forms'?'form':null;
      openCreate(kind);
    }else if(t.id==='azCreateCancel'){
      var panel=document.getElementById('azCreatePanel');if(panel)panel.remove();
    }else if(t.id==='azCreateSubmit'){
      azCreateProject();
    }
  },true);

})();
</script>
</body>
